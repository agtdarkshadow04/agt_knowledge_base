# AGT Knowledge Base configuration (config.yaml).
#
# Copy this file to config.yaml and edit it. Docker Compose mounts config.yaml
# read-only at /app/config.yaml (another path: AGT_KNOWLEDGE_BASE_CONFIG_FILE).
# The file is validated when the server starts: an unknown key or an invalid
# value stops it with an error naming the key. A missing file means "all
# defaults". The server never writes this file.
#
# Every key is shown commented out with its default. Secrets never go here:
# AGT_KNOWLEDGE_BASE_DB_PASSWORD, AGT_KNOWLEDGE_BASE_SETUP_PASSWORD and
# LOCAL_AUTH_SECRET belong in .env, which is never included in backups.
#
# The keys under site, articles, access and backup (except backup.preRestore)
# can also be changed in the admin dashboard's Settings tab. When this file
# sets one, the file wins: the dashboard shows it read-only.

# Config-file-only keys
server:
  # Listen address. Default: AGT_KNOWLEDGE_BASE_SERVER_HOST if set (0.0.0.0 in
  # the Docker image), else 127.0.0.1.
  # host: 127.0.0.1
  # port: 8081
  # Reverse proxies whose X-Forwarded-For and X-Forwarded-Proto to trust (client
  # addresses for rate limits, HTTPS for the Secure cookie): false, true, a proxy
  # IP or CIDR (string or list), or a number of proxy hops. The Compose stack's
  # Nginx is one hop, hence 1; use 2 behind an additional TLS proxy.
  trustProxy: 1
  # Log level: fatal, error, warn, info, debug, trace or silent.
  # logLevel: info

storage:
  # Directory for persistent files, relative to the working directory (/app in Docker).
  # dataDir: data
  # Pre-restore backups, relative to dataDir (a volume in docker-compose.yml).
  # backupsDir: backups

database:
  # PostgreSQL connection; the password is AGT_KNOWLEDGE_BASE_DB_PASSWORD in .env.
  # host: localhost             # default: AGT_KNOWLEDGE_BASE_DATABASE_HOST if set (the Compose stack sets it)
  # port: 5432
  # name: agt_knowledge_base
  # Scratch database for the restore preview (reserved for a later 2.x release).
  # previewName: agt_knowledge_base_preview
  # user: agt_knowledge_base
  # Connect with TLS and verify the server certificate.
  # ssl: false

session:
  # Sign-in lifetime in hours (1 to 168), for the Admin at /admin and for members.
  # ttlHours: 12
  # Secure attribute of the Admin cookie: auto (when a trusted proxy reports
  # HTTPS), true or false.
  # secureCookie: auto

rateLimits:
  # Attempts per client address per window. Member sign-in, Admin sign-in and
  # the Admin password change each count separately against login.
  # login:
  #   max: 10
  #   windowMinutes: 15
  # setup:            # first-run Admin setup
  #   max: 10
  #   windowMinutes: 15
  # adminUploads:     # backup restore uploads
  #   max: 120
  #   windowMinutes: 15

# Keys that can also be set in the dashboard
site:
  # Name shown in the header and the browser title (1 to 100 characters).
  # title: AGT Knowledge Base
  # Subtitle shown under the name on the home page (1 to 240 characters).
  # subtitle: Field-tested guides, community procedures, and traveller intelligence.
  # Support link: an absolute http: or https: URL.
  # supportUrl: https://www.nms-agt.com/support

backup:
  # Largest backup upload in bytes (1 MiB to 1 GiB). A TLS proxy in front of
  # the stack must accept request bodies at least this large.
  # maxZipBytes: 104857600
  # Largest total uncompressed size of an uploaded backup (1 MiB to 500 MB).
  # maxUncompressedBytes: 268435456
  # Most entries an uploaded archive may contain (3 to 10000).
  # maxEntries: 16
  preRestore:
    # Config file only: pre-restore backups to keep. Unset keeps every one.
    # keep: 10

articles:
  # Visibility of new articles: Public, Internal, Admin (legacy), or 0-5.
  # defaultVisibility: Internal

access:
  # Whether visitors who are not signed in can browse public articles.
  # allowPublicBrowsing: true
