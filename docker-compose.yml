services:
  knowledge-base:
    build: .
    image: agt-knowledge-base:latest
    restart: unless-stopped
    # Plain HTTP only, so the port is published on this host's loopback interface only (SEC-4).
    # Put a TLS-terminating reverse proxy in front (README: TLS and reverse proxies) and set
    # server.trustProxy. Publish on another interface only if that proxy runs on another machine.
    ports:
      - "127.0.0.1:8081:8081"
    # AGT_KNOWLEDGE_BASE_SETUP_PASSWORD and AGT_KNOWLEDGE_BASE_DB_PASSWORD (DEP-4).
    env_file:
      - path: .env
        required: false
    environment:
      AGT_KNOWLEDGE_BASE_DATABASE_HOST: db
    volumes:
      # Pre-restore backups and the restore-failed marker (DATA-10).
      - knowledge-base-data:/app/data
      # Non-secret settings; create it first: cp config.example.yaml config.yaml
      - ./config.yaml:/app/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    # POSTGRES_PASSWORD, the bootstrap superuser's password, only (DEP-3). The app never receives it.
    env_file: .env.db
    environment:
      # The app's own non-superuser role (DATA-11), created by deploy/postgres-init on first start.
      AGT_KNOWLEDGE_BASE_DB_PASSWORD: ${AGT_KNOWLEDGE_BASE_DB_PASSWORD:?Set AGT_KNOWLEDGE_BASE_DB_PASSWORD in .env}
    volumes:
      - knowledge-base-db:/var/lib/postgresql
      # Runs once, when the volume is empty: creates the agt_knowledge_base role and databases.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agt_knowledge_base"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  knowledge-base-data:
  knowledge-base-db:
