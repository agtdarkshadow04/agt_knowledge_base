services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agt_knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agt_knowledge_base']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - agt-postgres:/var/lib/postgresql/data

volumes:
  agt-postgres:
