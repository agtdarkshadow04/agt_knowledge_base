services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # The bootstrap superuser: used only by the init script below and for
      # maintenance (docker compose exec postgres psql -U "$POSTGRES_USER").
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # The app's own non-superuser role (DATA-11, DEP-3), created on first start.
      AGT_KNOWLEDGE_BASE_DB_PASSWORD: ${AGT_KNOWLEDGE_BASE_DB_PASSWORD:?Set AGT_KNOWLEDGE_BASE_DB_PASSWORD in .env}
    ports:
      - '${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d postgres']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - agt-postgres:/var/lib/postgresql/data
      # Runs once, when the volume is empty: creates the agt_knowledge_base role
      # and databases. An existing 1.x volume needs deploy/upgrade-database-role.sql.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro

  api:
    image: agt-knowledge-base-api
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      AGT_KNOWLEDGE_BASE_DATABASE_HOST: postgres
      # The agt_knowledge_base role's password (database.user); the server runs
      # the migrations itself at startup (DATA-4).
      AGT_KNOWLEDGE_BASE_DB_PASSWORD: ${AGT_KNOWLEDGE_BASE_DB_PASSWORD:?Set AGT_KNOWLEDGE_BASE_DB_PASSWORD in .env}
      # One-time password for creating the Admin at /admin. Remove it from .env
      # once setup is complete; it is ignored after the Admin exists.
      AGT_KNOWLEDGE_BASE_SETUP_PASSWORD: ${AGT_KNOWLEDGE_BASE_SETUP_PASSWORD:-}
      # Deprecated 1.x name, read only when the line above is empty (until 3.0.0).
      AGT_SETUP_PASSWORD: ${AGT_SETUP_PASSWORD:-}
    volumes:
      # Non-secret settings; create it with: cp config.example.yaml config.yaml
      - ./config.yaml:/app/config.yaml:ro
      # Pre-restore backups (storage.dataDir/storage.backupsDir).
      - agt-backups:/app/data/backups
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: agt-knowledge-base-web
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      # Loopback only by default (SEC-4): the stack speaks plain HTTP. Put a TLS
      # proxy in front (README, HTTPS) before setting APP_BIND_ADDRESS=0.0.0.0.
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  agt-postgres:
  agt-backups:
