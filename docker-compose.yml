services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agt_knowledge_base}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - agt-postgres:/var/lib/postgresql/data

  migrate:
    image: agt-knowledge-base-api
    build:
      context: .
      target: api
    command: ['node', 'server/scripts/migrate.js']
    environment: &database-environment
      AGT_KNOWLEDGE_BASE_DATABASE_HOST: postgres
      AGT_KNOWLEDGE_BASE_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # The database name and user belong in config.yaml (database.name,
      # database.user). Until 3.0.0 these deprecated variables carry the values
      # from .env for installations that have not set them there; config.yaml wins,
      # and the server logs a deprecation warning only when it uses one.
      DB_NAME: ${POSTGRES_DB:-}
      DB_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: agt-knowledge-base-api
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      <<: *database-environment
      # One-time password for creating the Admin at /admin. Remove it from .env
      # once setup is complete; it is ignored after the Admin exists.
      AGT_KNOWLEDGE_BASE_SETUP_PASSWORD: ${AGT_KNOWLEDGE_BASE_SETUP_PASSWORD:-}
      # Deprecated 1.x name, read only when the line above is empty (until 3.0.0).
      AGT_SETUP_PASSWORD: ${AGT_SETUP_PASSWORD:-}
    volumes:
      # Non-secret settings; create it with: cp config.example.yaml config.yaml
      - ./config.yaml:/app/config.yaml:ro
      # Pre-restore backups (storage.dataDir/storage.backupsDir).
      - agt-backups:/app/data/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: agt-knowledge-base-web
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      # Loopback only by default (SEC-4): the stack speaks plain HTTP. Put a TLS
      # proxy in front (README, HTTPS) before setting APP_BIND_ADDRESS=0.0.0.0.
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  agt-postgres:
  agt-backups:
