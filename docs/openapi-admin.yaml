openapi: 3.1.0
info:
  title: AGT Knowledge Base Admin API
  version: 2.0.0
  summary: The installation Admin's routes (`/admin/*`).
  description: |
    Routes of the installation Admin: first-run setup, Admin sign-in, member
    accounts, statistics, settings, and backups. Public and member routes are
    described in `openapi.yaml`.

    The Admin signs in with `POST /admin/auth/login` and receives the
    `agt_admin_session` cookie (`HttpOnly`, `SameSite=Strict`,
    `Path=/api/admin`). Member bearer tokens are ignored on every admin
    route. **Every non-GET `/admin/*` request must send `x-agt-request: 1`**,
    including setup and sign-in, or it is rejected with
    `403 CSRF_HEADER_REQUIRED` before anything else happens.

    Every error response has the body `{ code, message }`, plus `issues` for
    `VALIDATION_ERROR`. See `docs/API.md` for details.
servers:
  - url: /api
    description: Behind Nginx, and through the Vite proxy in development.
security: []
tags:
  - name: Admin setup & session
    description: First-run setup, Admin sign-in and sign-out, and the Admin password.
  - name: Members
    description: Member accounts (Editors and Moderators).
  - name: Data & settings
    description: Archive statistics, the article inventory, and dashboard-editable settings.
  - name: Backups
    description: ZIP backup download, preview, and restore.

paths:
  /admin/setup/status:
    get:
      operationId: getSetupStatus
      tags: [Admin setup & session]
      summary: Check whether first-run setup is needed
      responses:
        '200':
          description: The setup state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }

  /admin/setup:
    post:
      operationId: completeSetup
      tags: [Admin setup & session]
      summary: Create the Admin account
      description: |
        Creates the single Admin on a fresh installation and starts a session.
        Requires `AGT_SETUP_PASSWORD` to be set on the server; the new password
        must differ from it. Rate-limited per client address (`rateLimits.setup`,
        10 attempts per 15 minutes by default).
      x-rate-limit: setup
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupInput' }
      responses:
        '201':
          description: The Admin was created and signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '400':
          description: The body is invalid, the passwords differ, or the new password equals the setup password.
          x-error-codes: [INVALID_JSON, VALIDATION_ERROR, PASSWORD_REUSED]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401':
          description: The setup password is wrong.
          x-error-codes: [INVALID_SETUP_PASSWORD]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`AGT_SETUP_PASSWORD` is not set, or the CSRF header is missing.'
          x-error-codes: [SETUP_DISABLED, CSRF_HEADER_REQUIRED]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: An Admin already exists.
          x-error-codes: [SETUP_ALREADY_COMPLETED]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/auth/login:
    post:
      operationId: adminLogin
      tags: [Admin setup & session]
      summary: Sign in as the Admin
      description: |
        Starts an Admin session and sets the session cookie. Member accounts
        cannot sign in here. Rate-limited per client address
        (`rateLimits.adminLogin`, 10 attempts per 15 minutes by default).
      x-rate-limit: adminLogin
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '400':
          description: The body is not JSON, or the username or password is missing.
          x-error-codes: [INVALID_JSON, VALIDATION_ERROR]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: The username or password is wrong.
          x-error-codes: [INVALID_CREDENTIALS]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/CsrfHeaderRequired' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/auth/logout:
    post:
      operationId: adminLogout
      tags: [Admin setup & session]
      summary: Sign out
      description: Revokes the session on the server and clears the cookie.
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Signed out.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfHeaderRequired' }

  /admin/auth/session:
    get:
      operationId: adminSession
      tags: [Admin setup & session]
      summary: Get the Admin session
      security:
        - adminCookie: []
      responses:
        '200':
          description: The signed-in Admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/auth/password:
    put:
      operationId: changeAdminPassword
      tags: [Admin setup & session]
      summary: Change the Admin password
      description: |
        Changes the password, revokes every Admin session, and starts a new
        one with a fresh cookie. Rate-limited per client address
        (`rateLimits.adminPassword`, 10 attempts per 15 minutes by default).
      x-rate-limit: adminPassword
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPasswordChange' }
      responses:
        '200':
          description: The password was changed; the response sets a new session cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '400':
          description: The body is invalid, the passwords differ, or the new password equals the setup password.
          x-error-codes: [INVALID_JSON, VALIDATION_ERROR, PASSWORD_REUSED]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: The current password is wrong, or the CSRF header is missing.
          x-error-codes: [INVALID_CURRENT_PASSWORD, CSRF_HEADER_REQUIRED]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/users:
    get:
      operationId: listUsers
      tags: [Members]
      summary: List member accounts
      security:
        - adminCookie: []
      parameters:
        - name: search
          in: query
          description: Case-insensitive substring match on username, display name, or email.
          schema: { type: string, maxLength: 200, default: '' }
        - name: role
          in: query
          schema: { type: string, enum: [all, Editor, Moderator], default: all }
        - name: active
          in: query
          schema: { type: string, enum: [all, active, inactive], default: all }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: One page of member accounts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalUserListResult' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      operationId: createUser
      tags: [Members]
      summary: Create a member account
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalUserCreate' }
      responses:
        '201':
          description: The created member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalUser' }
        '400': { $ref: '#/components/responses/InvalidBody' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfHeaderRequired' }
        '409': { $ref: '#/components/responses/UserConflict' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }

  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: updateUser
      tags: [Members]
      summary: Update a member account
      description: |
        Replaces the username, display name, email, role, and active state.
        Changing the role or active state signs the member out everywhere.
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalUserUpdate' }
      responses:
        '200':
          description: The updated member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalUser' }
        '400': { $ref: '#/components/responses/InvalidUserWrite' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfHeaderRequired' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '409': { $ref: '#/components/responses/UserConflict' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
    delete:
      operationId: deleteUser
      tags: [Members]
      summary: Delete a member account
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Deleted.
        '400':
          description: The user ID is not a UUID.
          x-error-codes: [INVALID_USER_ID]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfHeaderRequired' }
        '404': { $ref: '#/components/responses/UserNotFound' }

  /admin/users/{userId}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: setUserPassword
      tags: [Members]
      summary: Set a member's password
      description: Sets a new password and signs the member out everywhere.
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordWrite' }
      responses:
        '204':
          description: The password was changed.
        '400': { $ref: '#/components/responses/InvalidUserWrite' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfHeaderRequired' }
        '404': { $ref: '#/components/responses/UserNotFound' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }

  /admin/stats:
    get:
      operationId: getStats
      tags: [Data & settings]
      summary: Get archive statistics
      security:
        - adminCookie: []
      responses:
        '200':
          description: Counts across every visibility level.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStats' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/articles:
    get:
      operationId: listAllArticles
      tags: [Data & settings]
      summary: List every article
      description: |
        The article inventory at every visibility level, with the same
        parameters and result as `GET /articles` in the member API. Read-only:
        the Admin cannot write articles.
      security:
        - adminCookie: []
      parameters:
        - name: search
          in: query
          schema: { type: string, maxLength: 200, default: '' }
        - name: tagId
          in: query
          schema: { type: string, format: uuid }
        - name: visibility
          in: query
          schema:
            type: string
            enum: [all, public, internal, admin, '0', '1', '2', '3', '4', '5']
            default: all
        - name: pinned
          in: query
          schema: { type: string, enum: [all, pinned], default: all }
        - name: protection
          in: query
          schema: { type: string, enum: [all, protected, unprotected], default: all }
        - name: verification
          in: query
          schema: { type: string, enum: [all, verified, unverified], default: all }
        - name: sort
          in: query
          schema: { type: string, enum: [createdAt, modifiedAt, title], default: modifiedAt }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        '200':
          description: One page of article summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticleListResult' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [Data & settings]
      summary: Get the dashboard settings
      description: Every dashboard-editable setting with its effective value, its `config.yaml` key, and where the value comes from.
      security:
        - adminCookie: []
      responses:
        '200':
          description: The settings view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettingsView' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      operationId: updateAdminSettings
      tags: [Data & settings]
      summary: Change dashboard settings
      description: |
        Saves the settings present in the body; omitted settings are left
        unchanged. A setting that `config.yaml` defines cannot be changed and
        fails the whole request with `SETTING_DEFINED_IN_FILE`. `null` clears a
        backup limit's dashboard value so its default applies again; other
        settings cannot be cleared. `version` must equal the current settings
        version.
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsWrite' }
      responses:
        '200':
          description: The updated settings view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettingsView' }
        '400':
          description: The body is invalid, or a non-clearable setting was set to `null`.
          x-error-codes: [INVALID_REQUEST, INVALID_JSON, VALIDATION_ERROR, INVALID_SETTING]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfHeaderRequired' }
        '409':
          description: A submitted setting is defined in `config.yaml`, or the settings changed since they were read.
          x-error-codes: [SETTING_DEFINED_IN_FILE, VERSION_CONFLICT]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }

  /admin/backup:
    get:
      operationId: downloadBackup
      tags: [Backups]
      summary: Download a backup
      description: |
        Streams a ZIP archive of every application table (except Admin
        sessions) and the current `config.yaml`. The filename is
        `agt-kb-backup-<timestamp>.zip`, given in `Content-Disposition`.
      security:
        - adminCookie: []
      responses:
        '200':
          description: The backup archive.
          headers:
            Content-Disposition:
              description: '`attachment; filename="agt-kb-backup-<timestamp>.zip"`'
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, contentMediaType: application/zip }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /admin/backup/restore:
    post:
      operationId: restoreBackup
      tags: [Backups]
      summary: Preview or restore a backup
      description: |
        Send the raw ZIP archive as the body (not multipart). With
        `action=preview`, the archive is validated and a report of what a
        restore would do is returned; nothing changes. With `action=restore`,
        a pre-restore backup of the current data is written to
        `storage.backupsDir`, then the backup replaces all data. `config.yaml`
        is never restored, and every Admin session is cleared, so sign in again
        with the Admin account from the backup afterwards. The body may be up
        to the effective `backup.maxBytes` (100 MB by default) rather than 1 MB.
      security:
        - adminCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [preview, restore] }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, contentMediaType: application/zip }
      responses:
        '200':
          description: The preview, or the restore report (which adds `preRestoreBackup`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreReport' }
        '400':
          description: '`action` is missing or invalid, the body is empty, or the archive cannot be restored.'
          x-error-codes: [INVALID_ACTION, INVALID_REQUEST, INVALID_BACKUP]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/CsrfHeaderRequired' }
        '413':
          description: The archive is larger than `backup.maxBytes`.
          x-error-codes: [BODY_TOO_LARGE]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: The pre-restore backup could not be written, so nothing was restored.
          x-error-codes: [PRE_RESTORE_BACKUP_FAILED]
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: agt_admin_session
      description: |
        The Admin session cookie set by setup, sign-in, and password change:
        `HttpOnly`, `SameSite=Strict`, `Path=/api/admin`, and `Secure` on HTTPS.
        Sessions last `adminSession.ttlHours` (12 hours by default). Member
        bearer tokens are ignored on admin routes.

  headers:
    SessionCookie:
      description: '`agt_admin_session=<token>; HttpOnly; SameSite=Strict; Path=/api/admin` (plus `Secure` on HTTPS).'
      schema: { type: string }

  parameters:
    CsrfHeader:
      name: x-agt-request
      in: header
      required: true
      description: Must be `1` on every non-GET admin request.
      schema: { type: string, const: '1' }
    UserId:
      name: userId
      in: path
      required: true
      description: The member account ID.
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: There is no valid Admin session cookie. An expired cookie is cleared.
      x-error-codes: [UNAUTHENTICATED]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CsrfHeaderRequired:
      description: 'The `x-agt-request: 1` header is missing.'
      x-error-codes: [CSRF_HEADER_REQUIRED]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidQuery:
      description: A query parameter is invalid.
      x-error-codes: [VALIDATION_ERROR]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    InvalidBody:
      description: The body is missing, not JSON, or fails validation.
      x-error-codes: [INVALID_REQUEST, INVALID_JSON, VALIDATION_ERROR]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    InvalidUserWrite:
      description: The user ID or body is invalid.
      x-error-codes: [INVALID_USER_ID, INVALID_REQUEST, INVALID_JSON, VALIDATION_ERROR]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    UserNotFound:
      description: The member account does not exist.
      x-error-codes: [USER_NOT_FOUND]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UserConflict:
      description: Another member already has this username or email address.
      x-error-codes: [USER_CONFLICT]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BodyTooLarge:
      description: The request body is larger than 1 MB.
      x-error-codes: [BODY_TOO_LARGE]
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many attempts from this address. Retry after the number of seconds in `Retry-After`.
      x-error-codes: [RATE_LIMITED]
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      description: The body of every error response.
      required: [code, message]
      properties:
        code: { type: string, description: 'A stable, machine-readable error code.' }
        message: { type: string, description: A human-readable explanation. }
    ValidationError:
      type: object
      description: An error body; `VALIDATION_ERROR` responses also carry the Zod `issues`.
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        issues:
          type: array
          description: Every validation issue, each with `path` and `message`.
          items: { type: object }
    Password:
      type: string
      minLength: 12
      maxLength: 1024
      description: At least 12 characters, with a lowercase letter, an uppercase letter, a number, and a symbol.
    Username:
      type: string
      pattern: '^[a-z0-9_.-]{3,64}$'
      description: Trimmed and lowercased; 3–64 lowercase letters, numbers, dots, underscores, or hyphens.
    Role:
      type: string
      enum: [Editor, Moderator]
    Visibility:
      description: A legacy level (`Public`, `Internal`, `Admin`) or an AGT numeric level (`0`–`5`).
      oneOf:
        - type: string
          enum: [Public, Internal, Admin]
        - type: integer
          enum: [0, 1, 2, 3, 4, 5]
    SetupStatus:
      type: object
      required: [required, setupPasswordConfigured]
      properties:
        required: { type: boolean, description: No Admin exists yet. }
        setupPasswordConfigured: { type: boolean, description: '`AGT_SETUP_PASSWORD` is set on the server.' }
    SetupInput:
      type: object
      additionalProperties: false
      required: [setupPassword, username, password, passwordConfirmation]
      properties:
        setupPassword: { type: string, minLength: 1, maxLength: 1024, description: 'The value of `AGT_SETUP_PASSWORD`.' }
        username: { $ref: '#/components/schemas/Username' }
        password: { $ref: '#/components/schemas/Password' }
        passwordConfirmation: { type: string, description: Must equal `password`. }
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 1024 }
    AdminSession:
      type: object
      required: [username, setupPasswordSet]
      properties:
        username: { type: string }
        setupPasswordSet:
          type: boolean
          description: '`AGT_SETUP_PASSWORD` is still set on the server and should be removed.'
    AdminPasswordChange:
      type: object
      additionalProperties: false
      required: [currentPassword, password, passwordConfirmation]
      properties:
        currentPassword: { type: string, maxLength: 1024 }
        password: { $ref: '#/components/schemas/Password' }
        passwordConfirmation: { type: string, description: Must equal `password`. }
    LocalUser:
      type: object
      required: [id, username, displayName, role, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean, description: Inactive members cannot sign in. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LocalUserListResult:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LocalUser' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    LocalUserCreate:
      type: object
      additionalProperties: false
      required: [username, displayName, role, password]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254, description: Optional; an empty string means none. }
        role: { $ref: '#/components/schemas/Role' }
        password: { $ref: '#/components/schemas/Password' }
    LocalUserUpdate:
      type: object
      additionalProperties: false
      required: [username, displayName, role, isActive]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254, description: Optional; an empty string or omission removes it. }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
    PasswordWrite:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { $ref: '#/components/schemas/Password' }
    AdminStats:
      type: object
      required: [totalArticles, publicArticles, internalArticles, adminArticles, pinnedArticles, protectedArticles, verifiedArticles, articleRevisions, canonicalTags, orphanedTagReferences]
      properties:
        totalArticles: { type: integer }
        publicArticles: { type: integer }
        internalArticles: { type: integer }
        adminArticles: { type: integer }
        pinnedArticles: { type: integer }
        protectedArticles: { type: integer }
        verifiedArticles: { type: integer }
        articleRevisions: { type: integer }
        canonicalTags: { type: integer }
        orphanedTagReferences: { type: integer }
    Tag:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
    ArticleSummary:
      type: object
      description: See `ArticleSummary` in the member API.
      required: [id, title, excerpt, tags, visibility, isPinned, isProtected, isVerified, createdAt, createdBy, createdByName, modifiedAt, modifiedBy, modifiedByName, version]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        excerpt: { type: string }
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        isPinned: { type: boolean }
        isProtected: { type: boolean }
        isVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        createdByName: { type: string }
        modifiedAt: { type: string, format: date-time }
        modifiedBy: { type: string }
        modifiedByName: { type: string }
        version: { type: integer }
    ArticleListResult:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ArticleSummary' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    SettingEntry:
      type: object
      required: [key, value, source]
      properties:
        key: { type: string, description: 'The `config.yaml` key, such as `site.applicationName`.' }
        value: { description: The effective value. }
        source:
          type: string
          enum: [file, dashboard, default]
          description: '`file` values cannot be changed through the API.'
    AdminSettingsView:
      type: object
      required: [version, settings]
      properties:
        version: { type: integer, description: Send it back on `PUT /admin/settings`. }
        settings:
          type: object
          description: |
            One `SettingEntry` per setting: `applicationName`, `applicationSubtitle`,
            `defaultVisibility`, `allowPublicBrowsing`, `backupMaxBytes`,
            `backupMaxEntries`, and `backupMaxUncompressedBytes`.
          additionalProperties: { $ref: '#/components/schemas/SettingEntry' }
    SettingsWrite:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        applicationName: { type: string, minLength: 1, maxLength: 80 }
        applicationSubtitle: { type: string, minLength: 1, maxLength: 240 }
        defaultVisibility: { $ref: '#/components/schemas/Visibility' }
        allowPublicBrowsing: { type: boolean }
        backupMaxBytes:
          type: [integer, 'null']
          minimum: 1048576
          maximum: 1073741824
          description: 1 MB to 1 GB; `null` restores the default.
        backupMaxEntries:
          type: [integer, 'null']
          minimum: 3
          maximum: 10000
          description: '`null` restores the default.'
        backupMaxUncompressedBytes:
          type: [integer, 'null']
          minimum: 1048576
          maximum: 524288000
          description: 1 MB to 500 MB; `null` restores the default.
        version: { type: integer, minimum: 1, description: The current settings version. }
    DiffLine:
      type: object
      required: [kind, text]
      properties:
        kind: { type: string, enum: [' ', '-', '+'] }
        text: { type: string }
    RestoreReport:
      type: object
      description: A restore preview; a completed restore also has `preRestoreBackup`.
      required: [createdAt, appVersion, migrations, counts, config, ignoredSettings]
      properties:
        createdAt: { type: string, format: date-time, description: When the backup was taken. }
        appVersion: { type: string }
        migrations:
          type: object
          description: '`backup`: migrations the backup was taken at; `upgrade`: migrations the restore applies to bring it up to date.'
          properties:
            backup:
              type: array
              items: { type: string }
            upgrade:
              type: array
              items: { type: string }
        counts:
          type: object
          description: Row counts per table.
          additionalProperties: { type: integer }
        config:
          type: object
          description: The backup's `config.yaml` compared with the current one. It is never restored.
          properties:
            included: { type: boolean }
            content: { type: [string, 'null'] }
            diff:
              type: [array, 'null']
              items: { $ref: '#/components/schemas/DiffLine' }
            identical: { type: boolean }
        ignoredSettings:
          type: array
          description: Settings in the backup that `config.yaml` now defines; they are not restored.
          items: { type: string }
        preRestoreBackup:
          type: string
          description: Only after `action=restore`; the filename of the pre-restore backup in `storage.backupsDir`.
