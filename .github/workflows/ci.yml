name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: npm run check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # TEST-3: a non-superuser role with CREATEDB, used only by tests.
      AGT_KNOWLEDGE_BASE_TEST_DATABASE_URL: postgres://agt_test:ci-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: PostgreSQL 18 client tools (BAK-6) and the test role
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          PGPASSWORD=ci-superuser psql -h 127.0.0.1 -U postgres -c "CREATE ROLE agt_test LOGIN NOSUPERUSER CREATEDB NOCREATEROLE PASSWORD 'ci-test-password'"
      - run: npm ci
      - name: Every install script has a decision (STACK-7)
        run: |
          npm install-scripts ls
          npm install-scripts ls --json | node -e 'process.exit(JSON.parse(require("fs").readFileSync(0, "utf8")).allowScripts.length ? 1 : 0)'
      - run: npm run check

  e2e:
    name: npm run test:e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGT_KNOWLEDGE_BASE_TEST_DATABASE_URL: postgres://agt_test:ci-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: PostgreSQL 18 client tools (BAK-6) and the test role
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"
          PGPASSWORD=ci-superuser psql -h 127.0.0.1 -U postgres -c "CREATE ROLE agt_test LOGIN NOSUPERUSER CREATEDB NOCREATEROLE PASSWORD 'ci-test-password'"
      - run: npm ci
      # TEST-6: Chromium and its system libraries, from the locked @playwright/test.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: Docker Compose smoke test (TEST-8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configuration and secrets as the README says
        run: |
          cp config.example.yaml config.yaml
          cp .env.example .env
          cp .env.db.example .env.db
          sed -i "s/^AGT_KNOWLEDGE_BASE_SETUP_PASSWORD=.*/AGT_KNOWLEDGE_BASE_SETUP_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^AGT_KNOWLEDGE_BASE_DB_PASSWORD=.*/AGT_KNOWLEDGE_BASE_DB_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env.db
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: The service is healthy, answers on loopback only, and is ready for first-run setup
        run: |
          set -x
          docker compose ps
          app="$(docker compose ps -q knowledge-base)"
          db="$(docker compose ps -q db)"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$app")" = healthy
          curl -fsS http://127.0.0.1:8081/api/health | grep -q '"status":"ok"'
          status="$(curl -fsS http://127.0.0.1:8081/api/setup/status)"
          echo "$status" | grep -q '"adminExists":false'
          echo "$status" | grep -q '"setupPasswordConfigured":true'
          # SEC-4, DEP-2, DEP-3: the app only on loopback, the database not published at all.
          test "$(docker port "$app")" = '8081/tcp -> 127.0.0.1:8081'
          test -z "$(docker port "$db")"
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
