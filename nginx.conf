server {
  listen 80;
  server_name _;
  server_tokens off;

  # The API serves the member UI, the admin panel and /api/ itself (SRV-9);
  # Nginx only forwards. Rate limits are applied by the API (rateLimits.* in
  # config.yaml), which sees client addresses through X-Forwarded-For when
  # server.trustProxy allows.

  # Backup upload and download. The API enforces backup.maxBytes after it has
  # authenticated the request, so Nginx streams the body without buffering it
  # to disk and sets no size limit of its own. Large archives need longer timeouts.
  location /api/admin/backup {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://api:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://api:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
