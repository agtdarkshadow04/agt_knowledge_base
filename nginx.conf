# Keeps the scheme a TLS proxy in front of this Nginx reported, so the API can
# mark session cookies Secure (server.trustProxy must trust both hops).
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  # The API serves the member UI, the admin panel and /api/ itself (SRV-9);
  # Nginx only forwards. Rate limits are applied by the API (rateLimits.* in
  # config.yaml), which sees client addresses through X-Forwarded-For when
  # server.trustProxy allows.

  # Backup download and restore upload (BAK-1; /api/admin/backup/restore is the
  # deprecated upload path). The API enforces backup.maxZipBytes after it has
  # authenticated the request, so Nginx streams the body without buffering it
  # to disk and sets no size limit of its own. A restore's preview and its
  # pg_restore may each take up to 10 minutes.
  location ~ ^/api/admin/(backup|restore)$|^/api/admin/backup/restore$ {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_pass http://api:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location / {
    proxy_pass http://api:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
}
