server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Rate limits are applied by the API (rateLimits.* in config.yaml). The API
  # sees client addresses through X-Forwarded-For when server.trustProxy allows.

  # Backup upload and download. The API enforces backup.maxBytes after it has
  # authenticated the request, so Nginx streams the body without buffering it
  # to disk and sets no size limit of its own. Large archives need longer timeouts.
  location /api/admin/backup {
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://api:3001/admin/backup;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://api:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # The admin panel is a separate entry, reachable only by visiting /admin.
  location = /admin {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /admin.html =404;
  }

  location = /admin/ {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /admin.html =404;
  }

  location = /admin.html {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
